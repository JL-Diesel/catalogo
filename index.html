<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo JL Diesel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d2836">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: tablet-first. Dark header with logo, sticky search + filter bar, responsive card grid; detail opens as a sheet. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b2430; --muted:#5d6878; --line:#d9dde3;
  --steel:#1d2836; --accent:#e0a100; --accent-ink:#1b2430;
  --ok:#1f7a45; --ok-bg:#e3f3e9; --low:#9a5b00; --low-bg:#fdf0d6; --out:#b42318; --out-bg:#fde7e5;
  --ph:#e7eaee; --ph-ink:#8a95a5;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a212b; --ink:#e7ebf0; --muted:#9aa5b4; --line:#2c3644;
  --steel:#0c1117; --accent:#f2b51c; --accent-ink:#11161d;
  --ok:#5cc98a; --ok-bg:#16301f; --low:#f0b14a; --low-bg:#33260f; --out:#ff8a80; --out-bg:#3a1a18;
  --ph:#222b37; --ph-ink:#6c7888; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a212b; --ink:#e7ebf0; --muted:#9aa5b4; --line:#2c3644;
  --steel:#0c1117; --accent:#f2b51c; --accent-ink:#11161d;
  --ok:#5cc98a; --ok-bg:#16301f; --low:#f0b14a; --low-bg:#33260f; --out:#ff8a80; --out-bg:#3a1a18;
  --ph:#222b37; --ph-ink:#6c7888; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
header.top{background:var(--steel);color:#fff;padding-block:12px;padding-inline:16px}
.wrap{max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:50%;background:#fff;object-fit:contain;padding:4px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:#b9c3d0;font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-inline:16px}
.search input{width:100%;font:inherit;font-size:16px;min-height:48px;padding:11px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;min-width:0}
.filters select{font:inherit;font-size:15px;min-height:44px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0;width:100%}
.filters select.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.clear{font:inherit;font-size:13px;min-height:36px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:16px 40px;padding-inline:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:var(--muted)}
.card.is-out .img{opacity:.55}
.img{aspect-ratio:4/3;background:var(--ph);display:grid;place-items:center;position:relative;max-width:100%;width:100%;overflow:hidden}
/* Photos fill the same box as the placeholder, whatever their shape. */
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.img svg{width:40%;height:auto;color:var(--ph-ink)}
.img .nophoto{position:absolute;bottom:6px;left:8px;font-size:11px;color:var(--ph-ink)}
.img .count{position:absolute;bottom:6px;right:8px;font-size:11.5px;font-weight:600;background:rgba(20,26,34,.72);color:#fff;padding:2px 7px;border-radius:999px}
/* Detail gallery: swipe on tablets/phones, arrows and dots on any device. */
.gallery{position:relative;min-width:0}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.track::-webkit-scrollbar{display:none}
.track .img{flex:0 0 100%;scroll-snap-align:center}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(20,26,34,.6);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.gnav.prev{left:8px}.gnav.next{right:8px}
.gnav[disabled]{opacity:0;pointer-events:none}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(20,26,34,.3)}
.dots span.on{background:var(--accent)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.desc{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.fit{font-size:12.5px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;gap:8px}
.price{font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.stock{font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-low{background:var(--low-bg);color:var(--low)}
.s-out{background:var(--out-bg);color:var(--out)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:20px}
/* detail sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--surface);border-radius:10px;max-width:780px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.panel .img{aspect-ratio:1/1}
.pbody{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pbody h2{font-family:var(--f-display);font-size:25px;line-height:1.1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted)}
@media (pointer:coarse){.card:active{border-color:var(--accent)}}
@media (max-width:1099px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:699px){
  .bar{position:static}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{grid-template-columns:1fr}.panel .img{aspect-ratio:4/3}
  .brand h1{font-size:24px}.logo{width:52px;height:52px}
}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.desc{font-size:13.5px}.price{font-size:18px}.body{padding:8px 9px 10px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head><body>

let products=[];
function load(res,subtitle){
  const seen={};res.filas.forEach(r=>seen[r[0]]=(seen[r[0]]||0)+1);
  products=res.filas.map(([c,d,m,p,s,k,foto])=>{
    const u=" "+String(d).toUpperCase().replace(/-/g," ")+" ";
    const x={c,d,m,p,s:String(s),k:sentence(k),fotos:Array.isArray(foto)?foto:(foto?[foto]:[]),f:tags(FABRE,u),mo:tags(MOT,u),t:tags(TRK,u)};
    x.id=seen[c]>1?c+"-"+String(m).replace(/[^A-Za-z0-9]+/g,""):c;
    x.si=stockInfo(x.s);
    x.text=norm([x.c,x.d,x.m,x.k,...x.f,...x.mo,...x.t].join(" "));
    return x;
  });
  fill(sel.cat,products.map(p=>p.k),"Todas");
  fill(sel.fab,products.flatMap(p=>p.f),"Todos");
  fill(sel.motor,products.flatMap(p=>p.mo),"Todos");
  fill(sel.camion,products.flatMap(p=>p.t),"Todos");
  fill(sel.marca,products.map(p=>p.m),"Todas");
  $("sub").textContent=`${subtitle} · precios referenciales en dólares`;
  $("loading").hidden=true;
  render();
}
function stockInfo(s){
  if(s.startsWith("+"))return{cls:"s-ok",label:`${s} disponibles`,n:99,k:"mas"};
  const n=parseInt(s,10)||0;
  if(n<=0)return{cls:"s-out",label:"Agotado",n:0,k:"agot"};
  return{cls:"s-low",label:n===1?"Queda 1":`Quedan ${n}`,n,k:"pocos"};
}

function iconFor(k){
  const c=norm(k||"");
  const rules=[["turbo","turbo"],["filtro","filter"],["anillo|piston|camisa|liner|biela|bocina|concha|cigu|bloque","piston"],
    ["empacadura|sello|estopera|gorro|diafragma","gasket"],["sensor|solenoide","sensor"],["alternador|arranque","electric"],
    ["freno|pulmon|rachet|compresor|banda","brake"],["clutch|embrague|bombin","clutch"],["bomba","pump"],
    ["termostato|enfriador|aspa|ventilador|tanque","cooling"]];
  for(const [re,ic] of rules) if(new RegExp(re).test(c)) return ICONS[ic];
  return ICONS.engine;
}
const ph=k=>`<svg viewBox="0 0 64 64" aria-hidden="true">${iconFor(k)}</svg>`;
const money=n=>n==null?"Consultar":"$"+Number(n).toLocaleString("es-VE",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const $=id=>document.getElementById(id);
const sel={cat:$("f-cat"),fab:$("f-fab"),motor:$("f-motor"),camion:$("f-camion"),marca:$("f-marca"),stock:$("f-stock")};
function fill(el,vals,all){const prev=el.value;el.innerHTML=`<option value="">${all}</option>`+[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es")).map(v=>`<option>${esc(v)}</option>`).join("");el.value=prev;if(el.value!==prev)el.value=""}
const PAGE=60; let shown=PAGE, list=[];
const photoTag=(p,url)=>`<img src="${esc(url)}" referrerpolicy="no-referrer" alt="${esc(p.d)}" loading="lazy" onerror="photoFail(this,'${esc(p.k)}')">`;
function photoFail(img,k){
  if(/[?&]v=/.test(img.src)){img.src=img.src.replace(/&v=\d+/,"");return}
  img.replaceWith(document.createRange().createContextualFragment(ph(k)));
}
function imgHTML(p){
  if(!p.fotos.length) return `${ph(p.k)}<span class="nophoto">Sin foto</span>`;
  return photoTag(p,p.fotos[0])+(p.fotos.length>1?`<span class="count">${p.fotos.length} fotos</span>`:"");
}
function galleryHTML(p){
  if(p.fotos.length<2) return `<div class="img">${imgHTML(p)}</div>`;
  return `<div class="gallery"><div class="track" id="track">${p.fotos.map(u=>`<div class="img">${photoTag(p,u)}</div>`).join("")}</div>
    <button class="gnav prev" id="gprev" type="button" aria-label="Foto anterior">‹</button>
    <button class="gnav next" id="gnext" type="button" aria-label="Foto siguiente">›</button>
    <div class="dots" id="dots">${p.fotos.map((_,i)=>`<span${i?"":' class="on"'}></span>`).join("")}</div></div>`;
}
function wireGallery(){
  const tr=$("track");if(!tr)return;
  const n=tr.children.length, idx=()=>Math.round(tr.scrollLeft/tr.clientWidth);
  const sync=()=>{const i=idx();[...$("dots").children].forEach((d,k)=>d.classList.toggle("on",k===i));$("gprev").disabled=i===0;$("gnext").disabled=i===n-1};
  const go=d=>tr.scrollTo({left:(idx()+d)*tr.clientWidth,behavior:"smooth"});
  $("gprev").onclick=()=>go(-1);$("gnext").onclick=()=>go(1);
  tr.addEventListener("scroll",()=>requestAnimationFrame(sync),{passive:true});sync();
}
function filtered(){
  const words=norm($("q").value.trim()).split(/\s+/).filter(Boolean);
  const v=Object.fromEntries(Object.entries(sel).map(([k,e])=>[k,e.value]));
  Object.values(sel).forEach(e=>e.classList.toggle("on",!!e.value));
  return products.filter(p=>
    words.every(w=>p.text.includes(w)) &&
    (!v.cat||p.k===v.cat)&&(!v.marca||p.m===v.marca)&&(!v.fab||p.f.includes(v.fab))&&
    (!v.motor||p.mo.includes(v.motor))&&(!v.camion||p.t.includes(v.camion))&&
    (!v.stock||(v.stock==="disp"?p.si.n>0:p.si.k===v.stock)));
}
function cardHTML(p){
  const fit=[...p.mo,...p.t].join(" · ");
  return `<button class="card${p.si.n===0?" is-out":""}" type="button" data-id="${esc(p.id)}">

        <div class="desc">${esc(p.d)}</div>

        <div class="foot"><span class="price">${money(p.p)}</span><span class="stock ${p.si.cls}">${p.si.label}</span></div>

  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
  $("sheet").innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(p.d)}">

        ${row("Marca",p.m)}${row("Categoría",p.k)}${row("Vehículo",p.f.join(", "))}${row("Motor",p.mo.join(", "))}${row("Camión",p.t.join(", "))}
      </dl>

function closeSheet(){$("sheet").hidden=true;current=null}

// ---- Data: Google Sheet published as CSV, with the last good copy kept for offline use ----
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(cell);cell="";}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else if(ch!=='\r') cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const clean=v=>String(v==null?"":v).replace(/\s+/g," ").trim();
// Handles "26,50", "1.260,00", "1,260.00" and "26.5" (the sheet may use Spanish number format).
function toNumber(v){
  if(typeof v==="number")return v;
  let t=String(v).replace(/[^\d,.-]/g,"");
  if(t.includes(",")&&t.includes(".")) t=t.lastIndexOf(",")>t.lastIndexOf(".")?t.replace(/\./g,"").replace(",","."):t.replace(/,/g,"");
  else if(t.includes(",")) t=/^\d{1,3}(,\d{3})+$/.test(t)?t.replace(/,/g,""):t.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,"");
  const n=parseFloat(t);return isNaN(n)?null:n;
}
// Drive photos get a daily "v" parameter so a photo replaced in Drive (same link) shows up by the next day at the latest,
// instead of the browser keeping the old image.
const PHOTO_DAY=new Date().toISOString().slice(0,10).replace(/-/g,"");
function photoLink(link){const m=link.match(/\/d\/([\w-]{20,})/)||link.match(/[?&]id=([\w-]{20,})/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000&v=${PHOTO_DAY}`:link}
// Same rules as the Excel: header row with CODIGO…, category rows interleaved.
function rowsFromSheet(vals,fotos){
  const h=vals.findIndex(r=>r.some(c=>norm(clean(c))==="codigo"));
  if(h<0) throw new Error("No encontré la fila de títulos (CODIGO, NOMBRE ARTICULO, MARCA, PRECIO$, EXISTENCIA).");
  const head=vals[h].map(c=>norm(clean(c)));
  const col=ps=>{for(const p of ps){const i=head.findIndex(c=>c.startsWith(p));if(i>=0)return i}return -1};
  const iC=col(["codigo"]),iN=col(["nombre","descripcion","articulo"]),iM=col(["marca"]),iP=col(["precio"]),iE=col(["existencia","stock"]);
  let cat="";const out=[],seen={};
  for(const r of vals.slice(h+1)){
    const c=clean(r[iC]),n=clean(r[iN]),m=iM>=0?clean(r[iM]):"",p=iP>=0?clean(r[iP]):"",e=iE>=0?clean(r[iE]):"";
    if(((c&&!n)||(n&&!c))&&!m&&!p&&!e){cat=c||n;continue}
    if(!c||!n)continue;
    const k=c+"|"+m;if(seen[k])continue;seen[k]=1;
    out.push([c,n,m,toNumber(p),e||"0",cat,fotos[c.toUpperCase()]||[]]);
  }
  if(!out.length) throw new Error("La hoja no tiene productos.");
  return out;
}
function fotosFromSheet(vals){
  const out={};
  // A code can repeat on several rows (one photo per row, in order); a cell may also hold several links.
  vals.slice(1).forEach(r=>{
    const c=clean(r[0]).toUpperCase();if(!c)return;
    String(r[1]||"").split(/[\s,]+/).filter(l=>/^https?:\/\//i.test(l)).forEach(l=>(out[c]=out[c]||[]).push(photoLink(l)));
  });
  return out;
}
// Tries the published CSV first, then the direct export, so the page works whether or not the sheet is published.
function sheetURLs(cfg,gid){
  const b=`https://docs.google.com/spreadsheets/d/${cfg.SHEET_ID}`;
  return [`${b}/pub?gid=${gid}&single=true&output=csv`,`${b}/export?format=csv&gid=${gid}`];
}
async function fetchCSV(urls){
  let last;
  for(const url of urls){
    try{
      const r=await fetch(url+"&t="+Date.now(),{cache:"no-store"});
      if(!r.ok){last=new Error("La hoja respondió con error "+r.status+".");continue}
      const text=await r.text();
      if(/^\s*<(!doctype|html)/i.test(text)){last=new Error("La hoja no está publicada o no es pública.");continue}
      return parseCSV(text);
    }catch(e){last=new Error("No hay conexión con la hoja de Google.")}
  }
  throw last;
}
const CACHE_KEY="jl-catalogo-v1";
function saveCache(res){try{localStorage.setItem(CACHE_KEY,JSON.stringify(res))}catch(_){}}
function readCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||"null")}catch(_){return null}}
const fmtDate=ts=>new Date(ts).toLocaleString("es-VE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

async function start(){
  const cfg=window.CATALOGO_CONFIG||{};
  const cached=readCache();
  if(cached) load(cached,`Guardado ${fmtDate(cached.ts)} · actualizando…`);
  try{
    if(!cfg.SHEET_ID) throw new Error("Falta el ID de la hoja en config.js.");
    const [lista,fotos]=await Promise.all([fetchCSV(sheetURLs(cfg,cfg.LISTA_GID)),cfg.FOTOS_GID?fetchCSV(sheetURLs(cfg,cfg.FOTOS_GID)).catch(()=>[]):Promise.resolve([])]);
    const res={filas:rowsFromSheet(lista,fotosFromSheet(fotos)),ts:Date.now()};
    saveCache(res);
    load(res,`Actualizado ${fmtDate(res.ts)}`);
  }catch(err){
    if(cached) $("sub").textContent=`Sin conexión · mostrando la lista guardada el ${fmtDate(cached.ts)}`;
    else{$("loading").textContent="No se pudo cargar la lista de precios. "+err.message;$("sub").textContent="";}
  }
}
start();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
